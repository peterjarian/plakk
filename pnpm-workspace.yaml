packages:
  - apps/*
  - infra
  - oxlint-plugin-plakk
  - packages/*
  - scripts

catalog:
  "@effect/language-service": 0.87.1
  "@effect/tsgo": 0.24.3
  "@types/node": 24.13.2
  "@typescript/native-preview": 7.0.0-dev.20260707.2
  effect: 4.0.0-beta.92
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: 4.1.9
  vite-plus: latest
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAge: 0
allowBuilds:
  better-sqlite3: true
  electron: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  workerd: true
